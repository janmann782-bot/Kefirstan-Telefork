name: Android Java compile
on:
  push:
    branches: [kefirgram/extera-foundation]
    paths:
      - 'TMessagesProj/**'
      - '*.gradle'
      - '.github/workflows/android-compile.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install compile tools
        run: sdkmanager "platforms;android-33" "build-tools;33.0.1"
      - name: Prepare compile-only configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('API_KEYS').write_text('APP_ID=1\nAPP_HASH="00000000000000000000000000000000"\nMAPS_V2_API=CI_ONLY\nSIGNING_KEY_STORE_PASSWORD=CI_ONLY\nSIGNING_KEY_ALIAS=CI_ONLY\nSIGNING_KEY_PASSWORD=CI_ONLY\n')
          config = {"project_info": {"project_number": "1234567890", "project_id": "kefirgram-ci", "storage_bucket": "kefirgram-ci.invalid"}, "client": [{"client_info": {"mobilesdk_app_id": "1:1234567890:android:0000000000000000", "android_client_info": {"package_name": "com.kefirgram.messenger"}}, "api_key": [{"current_key": "CI_ONLY_NOT_A_REAL_KEY"}]}]}
          Path('TMessagesProj/google-services.json').write_text(json.dumps(config))
          PY
      - name: Compile Android Java (no APK, no real credentials)
        run: ./gradlew :TMessagesProj:compileBetaDebugJavaWithJavac --no-daemon --console=plain
