name: Import exteraGram source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-ayugram.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned open source baseline
        shell: bash
        run: |
          set -euo pipefail
          if test -f TMessagesProj/build.gradle; then
            echo "exteraGram baseline is already present"
            exit 0
          fi
          git remote add upstream https://github.com/exteraSquad/exteraGram.git
          git fetch --depth=1 upstream 6f78031aafd7f27e0dfaa31a207715569a6df1a2
          git checkout FETCH_HEAD -- . ':!.github/workflows'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import exteraGram 6f78031aafd7f27e0dfaa31a207715569a6df1a2 (GPL-2.0 source snapshot)"
          git push origin HEAD:main
