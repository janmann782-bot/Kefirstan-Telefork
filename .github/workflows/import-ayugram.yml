name: Import AyuGram source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-ayugram.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned open source baseline
        shell: bash
        run: |
          set -euo pipefail
          if test -f TMessagesProj/build.gradle; then
            echo "AyuGram baseline is already present"
            exit 0
          fi
          git remote add upstream https://github.com/AyuGram/AyuGram4A.git
          git fetch --depth=1 upstream 7013145676d36d82ee13c02a89f72097b7490dcd
          git checkout FETCH_HEAD -- .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import AyuGram4A 7013145676d36d82ee13c02a89f72097b7490dcd (GPL-2.0 source snapshot)"
          git push origin HEAD:main
